name: dva-infra

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: dva-clickhouse
    ports:
      - "19000:9000"
      - "18123:8123"
    environment:
      CLICKHOUSE_DB: poc
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/poc:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  mariadb:
    image: mariadb:11
    container_name: dva-mariadb
    ports:
      - "13306:3306"
    environment:
      MARIADB_DATABASE: poc
      MARIADB_USER: admin
      MARIADB_PASSWORD: password
      MARIADB_ROOT_PASSWORD: password
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb/poc:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dva-minio
    entrypoint: ["/bin/sh", "/minio/init-bucket.sh"]
    ports:
      - "19001:9000"
      - "19002:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio-data:/data
      - ./minio:/minio:ro
    healthcheck:
      test: ["CMD-SHELL", "mc ready local && test -f /tmp/minio-buckets-ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: dva-iceberg-rest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://poc/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:file:/home/iceberg/iceberg.db
    volumes:
      - iceberg-catalog-data:/home/iceberg
    ports:
      - "19003:8181"

  trino:
    image: trinodb/trino:479
    container_name: dva-trino
    depends_on:
      clickhouse:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    ports:
      - "18080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro

  trino-init:
    image: trinodb/trino:479
    container_name: dva-trino-init
    depends_on:
      minio:
        condition: service_healthy
      trino:
        condition: service_healthy
    environment:
      TRINO_URL: http://trino:8080
      TRINO_USER: poc_user
    volumes:
      - ./clickhouse:/clickhouse:ro
      - ./mariadb:/mariadb:ro
      - ./minio:/minio:ro
      - ./trino/init-schemas.sh:/init/init-schemas.sh:ro
    entrypoint: ["/bin/sh", "/init/init-schemas.sh"]

volumes:
  clickhouse-data:
  mariadb-data:
  minio-data:
  iceberg-catalog-data:
